; PlatformIO Project Configuration File for Qlockwork / zytQuadrat
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
data_dir = data
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266 @ ^4.2.1
board = d1_mini
framework = arduino

; Flash-Layout: 4 MB gesamt, 2 MB LittleFS + ~1 MB Sketch / OTA-faehig
; (Alternativ fuer 3 MB FS wie im alten Readme: eagle.flash.4m3m.ld)
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

; Nur Quelldateien im Projekt-Root kompilieren (misc/, layout/, data/ ignorieren)
build_src_filter = +<*.ino> +<*.cpp> +<*.c>

monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+

lib_deps =
    arduino-libraries/Arduino_JSON @ 0.1.0
    arduino-libraries/ArduinoHttpClient @ ^0.4.0
    adafruit/Adafruit NeoPixel @ ^1.11.0
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit MCP9808 Library @ ^2.0.0
    adafruit/Adafruit BME280 Library @ ^2.2.2
    adafruit/DHT sensor library @ ^1.4.3
    jchristensen/DS3232RTC @ ^2.0.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.4
    paulstoffregen/Time @ ^1.6.1
    tzapu/WiFiManager @ 0.16.0
    jchristensen/Timezone @ ^1.2.4

; Optional: Direktes OTA-Update ueber WLAN aus CLion/PlatformIO
; Zum Aktivieren die Kommentare entfernen und die IP deiner Uhr eintragen:
;[env:d1_mini_ota]
;extends = env:d1_mini
;upload_protocol = espota
;upload_port = 192.168.1.100
;upload_flags =
;    --auth=1234
